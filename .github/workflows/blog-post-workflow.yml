name: Latest Medium posts

on:
  schedule:
    - cron: "0 6 * * *"   # Every Day 06:00 UTC (09:00 TR)
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@ertugrulyaman99"
          max_post_count: 5
          template: "- [$title]($url) — <sub>$date</sub> $newline"
          date_format: "mmm yyyy"
          commit_message: "chore: update latest Medium posts"
